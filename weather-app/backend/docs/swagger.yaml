host: localhost:8080
info:
  contact: {}
  description: Weather * saved-locations API
  title: Waether App Api
  version: "1.0"
paths:
  /api/forecast/{lat}/{lon}:
    get:
      parameters:
      - description: Latitude
        in: path
        name: lat
        required: true
        type: string
      - description: Longitude
        in: path
        name: lon
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ForecastResponse'
        "400":
          description: lat/lon is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: upstream or server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get weather forecast
      tags:
      - weather
  /api/locations:
    post:
      consumes:
      - application/json
      parameters:
      - description: Location to save
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/models.LocationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save a location
      tags:
      - locations
  /api/weather/{city}:
    get:
      parameters:
      - description: City name
        in: path
        name: city
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WeatherResponse'
        "400":
          description: city is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: city not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: upstream or server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current weather
      tags:
      - weather
swagger: "2.0"
